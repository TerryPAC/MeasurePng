<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Overlay Measurement">
  <defs>
    <!-- Dark navy-teal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#072c28"/>
    </linearGradient>

    <!-- Teal-to-sky accent gradient for brackets & selection -->
    <linearGradient id="accent" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Soft glow for the selection box -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Checkerboard pattern for the transparent area -->
    <pattern id="check" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="translate(11,11)">
      <rect width="3.5" height="3.5" fill="rgba(255,255,255,0.03)"/>
      <rect width="1.75" height="1.75" fill="rgba(255,255,255,0.09)"/>
      <rect x="1.75" y="1.75" width="1.75" height="1.75" fill="rgba(255,255,255,0.09)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

  <!-- Faint image-frame hint -->
  <rect x="5" y="5" width="22" height="22" rx="2" fill="none"
        stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>

  <!-- Selection / transparent-area box -->
  <rect x="11" y="11" width="10" height="10" rx="1"
        fill="url(#check)"/>
  <rect x="11" y="11" width="10" height="10" rx="1"
        fill="rgba(34,211,238,0.08)"/>
  <rect x="11" y="11" width="10" height="10" rx="1"
        fill="none"
        stroke="url(#accent)" stroke-width="1"
        stroke-dasharray="2.5 1.8"
        filter="url(#glow)" opacity="0.9"/>

  <!-- Center crosshair (precision indicator) -->
  <line x1="13.5" y1="16" x2="18.5" y2="16"
        stroke="rgba(34,211,238,0.45)" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="16" y1="13.5" x2="16" y2="18.5"
        stroke="rgba(34,211,238,0.45)" stroke-width="0.75" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="0.9" fill="rgba(96,165,250,0.7)"/>

  <!-- Corner brackets — the hero element, bold and crisp -->
  <!-- Top-left -->
  <polyline points="5,11 5,5 11,5"
            fill="none" stroke="url(#accent)" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top-right -->
  <polyline points="21,5 27,5 27,11"
            fill="none" stroke="url(#accent)" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-left -->
  <polyline points="11,27 5,27 5,21"
            fill="none" stroke="url(#accent)" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-right -->
  <polyline points="21,27 27,27 27,21"
            fill="none" stroke="url(#accent)" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
