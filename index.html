<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PNG Transparent Area Measurement Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #f1f5f9;
            --color-surface: #ffffff;
            --color-surface-muted: #f8fafc;
            --color-border: #e2e8f0;
            --color-border-strong: #cbd5e1;
            --color-text: #0f172a;
            --color-text-muted: #475569;
            --color-text-subtle: #64748b;
            --color-primary: #0d9488;
            --color-primary-hover: #0f766e;
            --color-primary-soft: #ccfbf1;
            --color-accent: #0284c7;
            --color-accent-soft: #e0f2fe;
            --color-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
            --color-shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
            --color-shadow-panel: -4px 0 24px rgba(15, 23, 42, 0.06);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --font-sans: "DM Sans", system-ui, -apple-system, sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, monospace;
            --transition-fast: 150ms ease;
            --transition-base: 200ms ease;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .container {
            display: flex;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }

        .display-area {
            flex: 11;
            min-width: 0;
            height: 100%;
            padding: 6px;
            background: var(--color-bg);
            box-sizing: border-box;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            box-shadow: var(--color-shadow-md);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-container canvas {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .control-panel {
            flex: 4;
            flex-shrink: 0;
            min-width: 420px;
            height: 100%;
            padding: 24px 20px;
            background: var(--color-surface);
            border-left: 1px solid var(--color-border);
            box-shadow: var(--color-shadow-panel);
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* Control Panel Header */
        .panel-title {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--color-text);
            margin: 0 0 4px;
            line-height: 1.3;
        }

        .panel-title::after {
            content: "";
            display: block;
            width: 40px;
            height: 3px;
            margin: 10px auto 0;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
        }

        .readme-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-align: center;
            color: var(--color-accent);
            text-decoration: none;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            transition: background-color var(--transition-fast), color var(--transition-fast);
            cursor: pointer;
        }

        .readme-link:hover {
            background: var(--color-accent-soft);
            text-decoration: none;
            color: #0369a1;
        }

        .readme-link:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        /* Control Panel Inputs */
        input[type="file"] {
            margin: 0 0 14px;
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px dashed var(--color-border-strong);
            border-radius: var(--radius-md);
            background: var(--color-surface-muted);
            font-family: var(--font-sans);
            font-size: 13px;
            color: var(--color-text-muted);
            cursor: pointer;
            transition: border-color var(--transition-fast), background-color var(--transition-fast);
        }

        input[type="file"]:hover {
            border-color: var(--color-primary);
            background: var(--color-primary-soft);
        }

        input[type="file"]::file-selector-button {
            margin-right: 12px;
            padding: 6px 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--color-primary);
            color: #fff;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color var(--transition-fast);
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--color-primary-hover);
        }

        .input-group {
            margin-bottom: 0;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--color-text-muted);
            letter-spacing: 0.02em;
        }

        .input-group input[type="number"],
        .input-group input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-surface);
            font-family: var(--font-sans);
            font-size: 13px;
            color: var(--color-text);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .input-group input[type="number"]:focus,
        .input-group input[type="text"]:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }

        .input-group input[type="number"] {
            margin-bottom: 8px;
        }

        .input-group input::placeholder {
            color: var(--color-text-subtle);
        }

        .input-group.row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }

        .input-group.row input {
            flex: 1;
            margin-bottom: 0;
        }

        #bleedInputContainer {
            display: flex;
            flex: 1;
            min-width: 0;
        }

        #bleedInputContainer input {
            width: 100%;
        }

        #printableInputContainer {
            display: none;
            gap: 10px;
            flex: 2;
            min-width: 0;
        }

        #printableInputContainer input {
            flex: 1;
            min-width: 0;
        }

        /* Printable mode: narrower product fields, wider printable fields */
        .input-group.row:has(#toggleInputMode.active) #productWidth,
        .input-group.row:has(#toggleInputMode.active) #productHeight {
            flex: 1;
        }

        .input-group.row:has(#toggleInputMode.active) #printableInputContainer {
            flex: 2.25;
        }

        .input-group select {
            width: 100%;
            padding: 8px 36px 8px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background-color: var(--color-surface);
            font-family: var(--font-sans);
            font-size: 13px;
            color: var(--color-text);
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23475569" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
            background-repeat: no-repeat;
            background-position: right 8px center;
            cursor: pointer;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .input-group--horizontal {
            display: flex;
            align-items: center;
        }

        .input-group--horizontal label {
            margin-right: 10px;
            flex-shrink: 0;
        }

        .input-group--horizontal select {
            width: auto;
            flex-grow: 1;
        }

        /* Layout & Guides — secondary, compact */
        .controls-group--secondary {
            margin: 4px 0 8px;
            border: none;
            background: transparent;
            padding: 0;
        }

        .controls-group--secondary > summary {
            list-style: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--color-text-subtle);
            cursor: pointer;
            user-select: none;
            padding: 2px 0;
            transition: color var(--transition-fast);
        }

        .controls-group--secondary > summary::-webkit-details-marker {
            display: none;
        }

        .controls-group--secondary > summary::before {
            content: "";
            width: 0;
            height: 0;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            border-left: 5px solid currentColor;
            opacity: 0.7;
            transition: transform var(--transition-fast);
        }

        .controls-group--secondary[open] > summary::before {
            transform: rotate(90deg);
        }

        .controls-group--secondary > summary:hover {
            color: var(--color-text-muted);
        }

        .controls-group--secondary[open] > summary {
            margin-bottom: 6px;
        }

        .layout-guides {
            --layout-guides-control-width: 6.9rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 10px;
            background: var(--color-surface-muted);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
        }

        .layout-guides__row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .layout-guides__row label {
            flex-shrink: 0;
            width: 4.75rem;
            font-size: 11px;
            font-weight: 600;
            color: var(--color-text-subtle);
            letter-spacing: 0.02em;
        }

        .layout-guides__select {
            width: var(--layout-guides-control-width);
            flex-shrink: 0;
            padding: 5px 24px 5px 8px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background-color: var(--color-surface);
            font-family: var(--font-sans);
            font-size: 12px;
            color: var(--color-text);
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%2364748b" height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
            background-repeat: no-repeat;
            background-position: right 6px center;
            cursor: pointer;
        }

        .layout-guides__select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.12);
        }

        .layout-guides__row input {
            width: var(--layout-guides-control-width);
            min-width: var(--layout-guides-control-width);
            max-width: calc(100% - 4.75rem - 8px);
            flex: 0 1 auto;
            field-sizing: content;
            padding: 5px 8px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-surface);
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--color-text);
        }

        .layout-guides__row input::placeholder {
            color: var(--color-text-subtle);
            font-family: var(--font-sans);
            font-size: 11px;
        }

        .layout-guides__row input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.12);
        }

        /* Legend */
        .legend-container {
            margin: 12px 0;
            padding: 12px 14px;
            background: var(--color-surface-muted);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-item span {
            font-size: 13px;
            color: var(--color-text-muted);
            font-weight: 500;
        }

        .color-box {
            width: 14px;
            height: 14px;
            margin-right: 10px;
            border-width: 2px;
            border-style: solid;
            background: transparent;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .color-box.green {
            border-color: rgb(0, 240, 0);
        }

        .color-box.blue {
            border-color: rgb(0, 0, 252);
        }

        .color-box.magenta {
            border-color: rgb(252, 0, 200);
        }

        /* Buttons */
        .primary-button {
            margin: 8px auto;
            padding: 10px 20px;
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.01em;
            transition: background-color var(--transition-base), box-shadow var(--transition-base);
            width: 100%;
            display: block;
            box-shadow: var(--color-shadow-sm);
        }

        .primary-button:hover {
            background-color: var(--color-primary-hover);
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
        }

        .primary-button:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .primary-button:active {
            transform: translateY(1px);
        }

        /* Transform Controls */
        .control-group {
            margin: 10px 0;
            padding: 14px;
            background: var(--color-surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            box-shadow: var(--color-shadow-sm);
        }

        .control-group .input-group {
            margin-bottom: 0;
        }

        .slider-container {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            position: relative;
        }

        .slider-container:last-child {
            margin-bottom: 0;
        }

        .control-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .control-row .slider-container {
            flex: 1;
            margin-bottom: 0;
            padding-bottom: 0;
            position: relative;
            flex-wrap: wrap;
        }

        .transform-controls {
            padding: 10px 10px 6px;
            background: var(--color-surface-muted);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
        }

        .transform-controls .control-row {
            gap: 16px;
        }

        .transform-controls .slider-container {
            margin-bottom: 10px;
        }

        #transformControls {
            margin-bottom: 10px;
        }

        .control-row .slider-container label {
            width: 100%;
            margin-bottom: 5px;
            text-align: left;
        }

        .slider-container output {
            position: absolute;
            top: 100%;
            left: 0;
            transform: translateX(-50%);
            background: var(--color-primary);
            color: white;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            min-width: 32px;
            text-align: center;
            box-shadow: var(--color-shadow-sm);
            pointer-events: none;
            margin-top: 4px;
            z-index: 10;
        }

        .slider-container label {
            font-size: 12px;
            font-weight: 600;
            color: var(--color-text-muted);
            margin-right: 10px;
            white-space: nowrap;
            width: 100px;
            flex-shrink: 0;
            text-align: right;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            flex-grow: 1;
            height: 4px;
            background: var(--color-border);
            border-radius: 2px;
            outline: none;
            margin: 4px 0;
            transition: background var(--transition-base);
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        input[type="range"]:hover {
            background: var(--color-border-strong);
        }

        input[type="range"]:focus-visible {
            outline: none;
        }

        input[type="range"]:focus-visible::-webkit-slider-thumb {
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.25);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--color-primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.2);
            transition: background-color var(--transition-fast);
            margin-top: -5px;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--color-primary-hover);
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: var(--color-primary);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.2);
            transition: background-color var(--transition-fast);
        }

        input[type="range"]::-moz-range-thumb:hover {
            background: var(--color-primary-hover);
        }

        input[type="range"]::-ms-thumb {
            width: 14px;
            height: 14px;
            background: var(--color-primary);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.2);
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
        }

        input[type="range"]::-moz-range-track {
            height: 6px;
            border-radius: 3px;
        }

        input[type="range"]::-ms-track {
            height: 6px;
            border-radius: 3px;
            background: transparent;
            border-color: transparent;
            color: transparent;
        }

        .toggle-button {
            padding: 0 8px;
            font-size: 12px;
            background: var(--color-surface-muted);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--color-text-subtle);
            transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            flex-shrink: 0;
        }

        .toggle-button:hover {
            background: var(--color-border);
            color: var(--color-text);
            border-color: var(--color-border-strong);
        }

        .toggle-button:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .toggle-button.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary-hover);
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* Result Info */
        .result-info {
            margin: 10px 0;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            background: var(--color-accent-soft);
            border: 1px solid #bae6fd;
            border-left: 4px solid var(--color-accent);
            padding: 12px 40px 12px 12px;
            border-radius: var(--radius-md);
            position: relative;
            color: #0c4a6e;
        }

        .copy-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            padding: 6px;
            color: var(--color-accent);
            transition: background-color var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-button:hover {
            background: var(--color-accent-soft);
            color: #0369a1;
            border-color: #7dd3fc;
        }

        .copy-button:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        .copy-button svg {
            width: 16px;
            height: 16px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .primary-button:active {
                transform: none;
            }
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow: visible;
            }

            .display-area {
                flex: none;
                height: 55vh;
                min-height: 320px;
            }

            .control-panel {
                flex: none;
                width: 100%;
                min-width: 0;
                height: auto;
                max-height: none;
                border-left: none;
                border-top: 1px solid var(--color-border);
                box-shadow: 0 -4px 24px rgba(15, 23, 42, 0.06);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="display-area">
            <div class="canvas-container">
                <canvas id="resultCanvas"></canvas>
                <canvas id="interactiveCanvas"></canvas>
            </div>
        </div>
        <div class="control-panel">
            <h2 class="panel-title">Transparent Area Tool</h2>
            <a href="README.html" class="readme-link" target="_blank">README</a>
            <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">

            <div class="input-group row">
                <input type="number" id="productWidth" min="1" placeholder="Product Width">
                <input type="number" id="productHeight" min="1" placeholder="Product Height">
                <div id="bleedInputContainer">
                    <input type="number" id="bleed" min="0" placeholder="Bleed">
                </div>
                <div id="printableInputContainer">
                    <input type="number" id="printableWidth" min="1" placeholder="Printable W">
                    <input type="number" id="printableHeight" min="1" placeholder="Printable H">
                </div>
                <button id="toggleInputMode" class="toggle-button" title="Switch Input Mode (Bleed vs Printable Size)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                </button>
            </div>

            <details class="controls-group controls-group--secondary">
                <summary>Layout &amp; Guides</summary>
                <div class="layout-guides">
                    <div class="layout-guides__row">
                        <label for="alignmentControl">Align</label>
                        <select id="alignmentControl" class="layout-guides__select">
                            <option value="center" selected>Center</option>
                            <option value="top">Top</option>
                            <option value="bottom">Bottom</option>
                            <option value="right">Right</option>
                            <option value="left">Left</option>
                        </select>
                    </div>
                    <div class="layout-guides__row">
                        <label for="horizontalGuidesInput" title="Vertical guide lines at horizontal positions (0–1)">V Guides</label>
                        <input type="text" id="horizontalGuidesInput" placeholder="0.25, 0.75" inputmode="decimal" autocomplete="off">
                    </div>
                    <div class="layout-guides__row">
                        <label for="verticalGuidesInput" title="Horizontal guide lines at vertical positions (0–1)">H Guides</label>
                        <input type="text" id="verticalGuidesInput" placeholder="0.2, 0.8" inputmode="decimal" autocomplete="off">
                    </div>
                </div>
            </details>

            <div class="control-group">
                <div class="slider-container">
                    <label>Canvas Scale</label>
                    <input type="range" id="canvasScaleControl" min="1" max="2" value="1" step="0.01">
                </div>
                <div class="slider-container">
                    <label for="alphaThresholdControl">Alpha Threshold</label>
                    <input type="range" id="alphaThresholdControl" min="1" max="255" value="192" step="1">
                    <output id="alphaThresholdValue">192</output>
                </div>
            </div>

            <div class="legend-container">
                <div class="legend-item">
                    <div class="color-box green"></div>
                    <span>Transparent Area</span>
                </div>
                <div class="legend-item">
                    <div class="color-box blue"></div>
                    <span>Printable Rect</span>
                </div>
                <div class="legend-item">
                    <div class="color-box magenta"></div>
                    <span>Display Area</span>
                </div>
            </div>

            <button id="analyzeButton" class="primary-button">Start Detection</button>
            <button id="confirmButton" class="primary-button" style="visibility: hidden;">Confirm Detection</button>
            <button id="calculateMarginsButton" class="primary-button" style="visibility: hidden;">Calculate Margins</button>

            <details class="controls-group controls-group--secondary" id="transformControls" style="display: none;">
                <summary>Rotation &amp; Scale</summary>
                <div class="transform-controls">
                    <div class="control-row">
                        <div class="slider-container">
                            <label for="rotationControl">Rotation</label>
                            <input type="range" id="rotationControl" min="-90" max="90" value="0" step="1">
                            <output id="rotationValue">0°</output>
                        </div>
                        <div class="slider-container">
                            <label for="scaleControl">Scale</label>
                            <input type="range" id="scaleControl" min="50" max="200" value="100" step="1">
                            <output id="scaleValue">1.0</output>
                        </div>
                    </div>
                </div>
            </details>
            <div class="result-info" id="poInfo">
                <div class="info-content"></div>
                <button class="copy-button" data-target="poInfo">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </button>
            </div>
            <div class="result-info" id="templateInfo">
                <div class="info-content"></div>
                <button class="copy-button" data-target="templateInfo">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </button>
            </div>
            <div class="result-info" id="positionsInfo" style="display: none;">
                <div class="info-content"></div>
                <button class="copy-button" data-target="positionsInfo">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <script type="module" src="js/app.js"></script>
</body>

</html>
